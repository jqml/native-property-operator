name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify release version and assets
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json version $VERSION does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          node --check main.js
          node - <<'NODE'
          const fs = require('fs');
          const expected = ['main.js', 'manifest.json', 'styles.css'];
          for (const file of expected) {
            if (!fs.existsSync(file)) {
              throw new Error(`Missing release asset: ${file}`);
            }
          }
          if (fs.existsSync('data.json')) {
            throw new Error('Forbidden release asset exists in workspace: data.json');
          }
          NODE

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "Native Property Operator ${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}. Built by GitHub Actions with artifact attestations."
